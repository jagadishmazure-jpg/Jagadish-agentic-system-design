[project]
name = "harrowgate-agentic-system-design"
version = "0.1.0"
description = "One agentic AI system for a fictional airport, designed layer by layer: requirements to learning loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harrowgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905", "B023"]
