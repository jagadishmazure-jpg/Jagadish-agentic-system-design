# Offline CI: lint, tests, evaluation gate, documented-output drift, brand check, IaC checks, image build,
# secret scan. Nothing here calls Azure or any model API.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - name: Install (pinned)
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests (offline, mock model)
        run: python -m pytest -q
      - name: Test count
        run: python scripts/count_tests.py
      - name: Evaluation gate (re-run 129 scenarios + learning loop, compare with results/)
        run: python scripts/run_eval.py --check
      - name: Domain packs gate (8 domains, ablations, ROI and cost docs regenerated and compared)
        run: python scripts/run_packs.py --check
      - name: Documented output and numbers match a fresh run
        run: |
          python scripts/render_docs.py --check
          python scripts/check_numbers.py
      - name: No real brand names in code, docs or data
        run: python scripts/check_brands.py

  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STACK: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - name: terraform fmt / init / validate / test (mocked providers)
        run: |
          terraform -chdir="$STACK" fmt -check -recursive -diff
          terraform -chdir="$STACK" init -backend=false -input=false
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" test
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with: { tflint_version: v0.64.0, github_token: "${{ github.token }}" }
      - name: tflint
        working-directory: ${{ env.STACK }}
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: tflint --init && tflint --format compact
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: checkov
        run: pip install --quiet checkov==3.3.20 && checkov -d "$STACK" --config-file .checkov.yaml
      - name: bicep build
        run: az bicep install && az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
      - name: Other clouds (AWS, Google Cloud) - fmt / init / validate / tflint / checkov, never applied
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          for d in infra/aws infra/gcp; do
            terraform -chdir="$d" fmt -check -recursive -diff
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            (cd "$d" && tflint --init && tflint --format compact)
            checkov -d "$d" --config-file .checkov.yaml
          done

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the API image (not pushed)
        run: docker build -t harrowgate-assistant:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8080:8080 harrowgate-assistant:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -X POST http://127.0.0.1:8080/v1/assist \
            -d '{"passenger_id":"P-1002","text":"Which gate is BF117?"}' | grep -q '"destination": "C3"'

  secrets:
    # gitleaks over the full git history.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
